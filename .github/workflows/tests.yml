name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    # Offline tests use a fake embedder, so they run without the model or a GPU.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -v

  minimal:
    # Core logic with only numpy + pillow: decoders and MLX are optional for the tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --isolated --no-project --python 3.12 --with numpy --with pillow --with pytest env PYTHONPATH=src python -m pytest -v
